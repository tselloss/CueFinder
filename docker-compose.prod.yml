version: '3.8'

# Production Docker Compose Override
# Use: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    container_name: cuefinder-postgres-prod
    restart: always
    image: postgres:15
    ports: []  # Override base compose to remove external port exposure
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    environment:
      POSTGRES_DB: cuefinder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cuefinder"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - cuefinder-network

  # Ensure PgAdmin from the base compose is not exposed publicly in production
  pgadmin:
    ports: []

  backend:
    container_name: cuefinder-backend-prod
    restart: always
    build:
      context: .
      dockerfile: ./CueFinderBE/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=cuefinder;Username=postgres;Password=${DB_PASSWORD};SslMode=Disable;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=cuefinder.com
      - JwtSettings__Audience=cuefinder.com
      - JwtSettings__ExpirationMinutes=1440
      - CorsOrigins__Frontend=${CORS_FRONTEND_ORIGIN}
      - BASE_URL=https://billiardscuefinder.com
      - FRONTEND_URL=${CORS_FRONTEND_ORIGIN}
      - ImageStorageSettings__UploadPath=/app/wwwroot/uploads
      - ImageStorageSettings__MaxFileSizeMB=10
      - ImageStorageSettings__AllowedExtensions=jpg,jpeg,png,gif,webp
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./CueFinderBE/wwwroot/uploads:/app/wwwroot/uploads
    healthcheck:
      test:
        - CMD-SHELL
        - echo | openssl s_client -connect localhost:5000 -servername localhost -brief >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - cuefinder-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    container_name: cuefinder-frontend-prod
    restart: always
    build:
      context: ./CueFinderFE/cuefinderfe
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${FRONTEND_API_URL}
    ports: []
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - cuefinder-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    container_name: cuefinder-nginx-prod
    image: nginx:stable-alpine
    restart: always
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./CueFinderFE/cuefinderfe/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Commented out until SSL is set up
      # - letsencrypt:/etc/letsencrypt:ro
      # - certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cuefinder-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/cuefinder/data/postgres
  letsencrypt:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /etc/letsencrypt
  certbot_www:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/www/certbot

networks:
  cuefinder-network:
    driver: bridge
