version: '3.8'

# Production Docker Compose Override
# Use: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    container_name: cuefinder-postgres-prod
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    environment:
      POSTGRES_DB: cuefinder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # No external port binding needed - containers communicate internally via docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - cuefinder-network

  backend:
    container_name: cuefinder-backend-prod
    restart: always
    build:
      context: .
      dockerfile: ./CueFinderBE/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=cuefinder;Username=postgres;Password=${DB_PASSWORD}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=cuefinder.com
      - JwtSettings__Audience=cuefinder.com
      - JwtSettings__ExpirationMinutes=1440
      - CorsOrigins__Frontend=${CORS_FRONTEND_ORIGIN}
      - ImageStorageSettings__UploadPath=/app/wwwroot/uploads
      - ImageStorageSettings__MaxFileSizeMB=10
      - ImageStorageSettings__AllowedExtensions=jpg,jpeg,png,gif,webp
    # No external port binding needed - frontend nginx proxies to backend internally
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./CueFinderBE/wwwroot/uploads:/app/wwwroot/uploads
    healthcheck:
      test:
        - CMD-SHELL
        - >
          # dotnet runtime image doesn't ship curl; use a lightweight TCP probe.
          # If you want strict HTTP-level checks, we can add a tiny HealthProbe console app and run it with dotnet.
          echo | openssl s_client -connect localhost:5000 -servername localhost -brief >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - cuefinder-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    container_name: cuefinder-frontend-prod
    restart: always
    build:
      context: ./CueFinderFE/cuefinderfe
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${FRONTEND_API_URL}
    ports:
      - "0.0.0.0:8080:3000"  # Changed from 3000 to 8080 to avoid Docker bug
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - cuefinder-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/cuefinder/data/postgres

networks:
  cuefinder-network:
    driver: bridge
