# Production Docker Compose Override
# Use: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

x-backend-common: &backend-common
  restart: always
  build:
    context: .
    dockerfile: ./CueFinderBE/Dockerfile
  environment:
    - ASPNETCORE_ENVIRONMENT=Production
    - ASPNETCORE_URLS=http://+:5000
    - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=cuefinder;Username=postgres;Password=${DB_PASSWORD};SslMode=Disable;
    - JwtSettings__SecretKey=${JWT_SECRET}
    - JwtSettings__Issuer=cuefinder.com
    - JwtSettings__Audience=cuefinder.com
    - JwtSettings__ExpirationMinutes=1440
    - CorsOrigins__Frontend=${CORS_FRONTEND_ORIGIN}
    - BASE_URL=https://billiardscuefinder.com
    - FRONTEND_URL=${CORS_FRONTEND_ORIGIN}
    - ImageStorageSettings__StoragePath=/app/uploads/cues
    - ImageStorageSettings__ImageUrlBase=/uploads/cues
    - ImageStorageSettings__MaxFileSizeBytes=10485760
    - ImageStorageSettings__AllowedExtensions=.jpg,.jpeg,.png,.gif,.webp
    - ImageStorageSettings__AllowedMimeTypes=image/jpeg,image/png,image/gif,image/webp
    - Moderation__NudeNetUrl=http://cuefinder-opennsfw-prod:8000
    - EmailSettings__SmtpServer=${SMTP_SERVER:-smtp.gmail.com}
    - EmailSettings__SmtpPort=${SMTP_PORT:-587}
    - EmailSettings__FromEmail=${EMAIL_FROM:-cuefinderinfo@gmail.com}
    - EmailSettings__SmtpPassword=${SMTP_PASSWORD}
    - EmailSettings__EnableSsl=true
    - GmailApi__ClientId=${GMAIL_CLIENT_ID}
    - GmailApi__ClientSecret=${GMAIL_CLIENT_SECRET}
    - GmailApi__ProjectId=${GMAIL_PROJECT_ID}
    - GmailApi__FromEmail=${EMAIL_FROM:-cuefinderinfo@gmail.com}
  depends_on:
    postgres:
      condition: service_healthy
    opennsfw:
      condition: service_healthy
  volumes:
    - ./uploads:/app/uploads
  healthcheck:
    test:
      - CMD-SHELL
      - curl -f http://localhost:5000/health || exit 1
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 40s
  deploy:
    resources:
      limits:
        memory: 1G
      reservations:
        memory: 512M
  networks:
    - cuefinder-network
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    container_name: cuefinder-postgres-prod
    restart: always
    image: postgres:15
    ports: []  # Override base compose to remove external port exposure
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    environment:
      POSTGRES_DB: cuefinder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cuefinder"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - cuefinder-network

  # Ensure PgAdmin from the base compose is not exposed publicly in production
  pgadmin:
    ports: []

  opennsfw:
    container_name: cuefinder-opennsfw-prod
    restart: always
    build:
      context: ./deployment
      dockerfile: Dockerfile.nudenet
    ports: []
    volumes:
      - opennsfw_cache:/app/.opennsfw2
      - ./uploads/moderation:/tmp/moderation
    networks:
      - cuefinder-network
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend-blue:
    <<: *backend-common
    container_name: cuefinder-backend-blue-prod
    ports:
      - "5010:5010"

  backend-green:
    <<: *backend-common
    container_name: cuefinder-backend-green-prod
    ports:
      - "5002:5000"

  moderator:
    container_name: cuefinder-moderator-prod
    restart: always
    build:
      context: .
      dockerfile: SolutionLibraries/CueFinderModerator/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5010
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=cuefinder;Username=postgres;Password=${DB_PASSWORD};SslMode=Disable;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=cuefinder.com
      - JwtSettings__Audience=cuefinder.com
      - JwtSettings__ExpirationMinutes=1440
      - Moderation__NudeNetUrl=http://cuefinder-opennsfw-prod:8000
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
      opennsfw:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./uploads/moderation:/app/uploads/moderation
    networks:
      - cuefinder-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    container_name: cuefinder-frontend-prod
    restart: always
    build:
      context: ./CueFinderFE
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${FRONTEND_API_URL}
    ports: []
    depends_on:
      backend-blue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - cuefinder-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    container_name: cuefinder-nginx-prod
    image: nginx:stable-alpine
    restart: always
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./CueFinderFE/cuefinderfe/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./uploads:/app/uploads:ro
      - ./.deployment/backend-upstream.conf:/etc/nginx/conf.d/backend-upstream.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend-blue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cuefinder-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/cuefinder/data/postgres
  opennsfw_cache:
    driver: local
  letsencrypt:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /etc/letsencrypt
  certbot_www:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/www/certbot

networks:
  cuefinder-network:
    driver: bridge
