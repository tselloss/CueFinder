#cloud-config
# CueFinder Production Server - Hetzner Cloud Init
# Automatically configures Ubuntu server with Docker, Nginx, security, and monitoring

package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose
  - nginx
  - certbot
  - python3-certbot-nginx
  - ufw
  - fail2ban
  - git
  - curl
  - wget
  - htop
  - net-tools
  - vim

users:
  - name: cuefinder
    groups: sudo, docker
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      - ssh-rsa  cuefinder

runcmd:
  # Docker setup
  - systemctl start docker
  - systemctl enable docker
  - usermod -aG docker cuefinder
  
  # Configure Docker logging to prevent disk space issues
  - mkdir -p /etc/docker
  - echo '{"log-driver":"json-file","log-opts":{"max-size":"10m","max-file":"3"}}' > /etc/docker/daemon.json
  - systemctl restart docker
  
  # UFW Firewall setup
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'SSH'
  - ufw allow 80/tcp comment 'HTTP'
  - ufw allow 443/tcp comment 'HTTPS'
  - ufw --force enable
  
  # SSH Security hardening
  - sed -i 's/#PermitRootLogin yes/PermitRootLogin no/' /etc/ssh/sshd_config
  - sed -i 's/PermitRootLogin yes/PermitRootLogin no/' /etc/ssh/sshd_config
  - sed -i 's/#PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
  - sed -i 's/PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
  - echo 'AllowUsers cuefinder' >> /etc/ssh/sshd_config
  - systemctl restart sshd
  
  # Fail2ban configuration for SSH protection
  - systemctl enable fail2ban
  - systemctl start fail2ban
  - |
    cat > /etc/fail2ban/jail.local << 'EOF'
    [DEFAULT]
    bantime = 3600
    findtime = 600
    maxretry = 5
    destemail = your@email.com
    
    [sshd]
    enabled = true
    port = 22
    logpath = /var/log/auth.log
    maxretry = 3
    
    [nginx-http-auth]
    enabled = true
    port = http,https
    logpath = /var/log/nginx/error.log
    EOF
  - systemctl restart fail2ban
  
  # Create application directory structure
  - mkdir -p /home/cuefinder/app
  - mkdir -p /home/cuefinder/backups
  - mkdir -p /home/cuefinder/logs
  - chown -R cuefinder:cuefinder /home/cuefinder
  
  # Create welcome message
  - |
    cat > /etc/motd << 'EOF'
    
    ╔═══════════════════════════════════════════════════════════╗
    ║                                                           ║
    ║              🎱 CueFinder Production Server 🎱            ║
    ║                                                           ║
    ╚═══════════════════════════════════════════════════════════╝
    
    Server Information:
    -------------------
    • User: cuefinder
    • App Directory: /home/cuefinder/app
    • Logs: /home/cuefinder/logs
    • Backups: /home/cuefinder/backups
    
    Next Steps:
    -----------
    1. cd /home/cuefinder/app
    2. git clone https://github.com/tselloss/CueFinder.git .
    3. cp .env.example .env.production
    4. Edit .env.production with your secrets
    5. docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
    
    Useful Commands:
    ----------------
    • docker-compose ps              - Check container status
    • docker-compose logs -f         - View live logs
    • sudo systemctl status nginx    - Check Nginx status
    • sudo ufw status                - Check firewall
    • sudo fail2ban-client status    - Check fail2ban
    
    Documentation: /home/cuefinder/app/docs/CLOUD_DEPLOYMENT_GUIDE.md
    
    EOF
  
  # Set up automatic security updates
  - apt-get install -y unattended-upgrades
  - dpkg-reconfigure -plow unattended-upgrades
  
  # Create basic health check script
  - |
    cat > /home/cuefinder/health-check.sh << 'EOF'
    #!/bin/bash
    # Simple health check for CueFinder services
    
    echo "=== CueFinder Health Check ==="
    echo "Date: $(date)"
    echo ""
    
    echo "1. Docker Status:"
    systemctl is-active docker && echo "   ✓ Docker is running" || echo "   ✗ Docker is DOWN"
    echo ""
    
    echo "2. Containers:"
    docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
    echo ""
    
    echo "3. Disk Space:"
    df -h / | tail -1
    echo ""
    
    echo "4. Memory:"
    free -h | grep Mem
    echo ""
    
    echo "5. Nginx Status:"
    systemctl is-active nginx && echo "   ✓ Nginx is running" || echo "   ✗ Nginx is DOWN"
    echo ""
    
    echo "6. Firewall:"
    ufw status | head -3
    EOF
  - chmod +x /home/cuefinder/health-check.sh
  - chown cuefinder:cuefinder /home/cuefinder/health-check.sh

# SSH configuration
ssh_deletekeys: true
ssh_genkeytypes: ['rsa', 'ecdsa', 'ed25519']
disable_root: true
ssh_pwauth: false

# Set timezone to Europe/Athens (Greece)
timezone: Europe/Athens

# Reboot after setup (optional, comment out if not needed)
# power_state:
#   mode: reboot
#   message: Initial setup complete, rebooting...
#   timeout: 30

# Final message logged to console
final_message: |
  ========================================
  CueFinder Server Setup Complete!
  ========================================
  
  SSH Access:
    ssh cuefinder@YOUR_SERVER_IP
  
  Next: Follow the deployment guide
  ========================================
