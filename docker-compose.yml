services:
  postgres:
    image: postgres:15
    container_name: cuefinder-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: cuefinder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cuefinder"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cuefinder-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cuefinder-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cuefinder.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - cuefinder-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  opennsfw:
    build:
      context: ./deployment
      dockerfile: Dockerfile.nudenet
    container_name: cuefinder-opennsfw
    ports:
      - "8001:8000"
    volumes:
      - opennsfw_cache:/app/.opennsfw2
      - ./uploads/moderation:/tmp/moderation
    networks:
      - cuefinder-network
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: CueFinderBE/Dockerfile
    container_name: cuefinder-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=cuefinder-postgres;Port=5432;Database=cuefinder;Username=postgres;Password=admin;SslMode=Disable;
      - BASE_URL=http://localhost:5000
      - FRONTEND_URL=http://localhost:3000
      - Moderation__Disabled=false
      - ModerationServiceUrl=http://moderator:5001
      - Sms__Provider=Mock
      - Sms__ApiUrl=
      - Sms__ApiKey=
      - Sms__SenderId=CueFinder
      - JwtSettings__SecretKey=your-super-secret-jwt-key-change-this-in-production-must-be-at-least-32-characters
      - JwtSettings__Issuer=CueFinder
      - JwtSettings__Audience=CueFinderUsers
      - JwtSettings__ExpirationMinutes=60
      - Moderation__NudeNetUrl=http://opennsfw:8000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      opennsfw:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./uploads/moderation:/app/uploads/moderation
    networks:
      - cuefinder-network
    restart: unless-stopped

  moderator:
    build:
      context: .
      dockerfile: SolutionLibraries/CueFinderModerator/Dockerfile
    container_name: cuefinder-moderator
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=cuefinder-postgres;Port=5432;Database=cuefinder;Username=postgres;Password=admin;SslMode=Disable;
      - JwtSettings__SecretKey=your-super-secret-jwt-key-change-this-in-production-must-be-at-least-32-characters
      - JwtSettings__Issuer=CueFinder
      - JwtSettings__Audience=CueFinderUsers
      - JwtSettings__ExpirationMinutes=60
      - Moderation__NudeNetUrl=http://opennsfw:8000
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      opennsfw:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./uploads/moderation:/app/uploads/moderation
    networks:
      - cuefinder-network
    restart: unless-stopped

  frontend:
    build:
      context: ./CueFinderFE
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:5000/api
    container_name: cuefinder-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cuefinder-network
    restart: unless-stopped

networks:
  cuefinder-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  opennsfw_cache:
    driver: local
