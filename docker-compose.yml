services:
  postgres:
    image: postgres:15
    container_name: cuefinder-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: cuefinder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cuefinder"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cuefinder-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cuefinder-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cuefinder.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - cuefinder-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build:
      context: .
      dockerfile: CueFinderBE/Dockerfile
    container_name: cuefinder-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=cuefinder-postgres;Port=5432;Database=cuefinder;Username=postgres;Password=admin;SslMode=Disable;
      - BASE_URL=http://localhost:5000
      - FRONTEND_URL=http://localhost:3000
      - Sms__Provider=Mock
      - Sms__ApiUrl=
      - Sms__ApiKey=
      - Sms__SenderId=CueFinder
      - JwtSettings__SecretKey=your-super-secret-jwt-key-change-this-in-production-must-be-at-least-32-characters
      - JwtSettings__Issuer=CueFinder
      - JwtSettings__Audience=CueFinderUsers
      - JwtSettings__ExpirationMinutes=60
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cuefinder-network
    restart: unless-stopped

  frontend:
    build:
      context: ./CueFinderFE/cuefinderfe
      dockerfile: Dockerfile
    container_name: cuefinder-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - cuefinder-network
    restart: unless-stopped

networks:
  cuefinder-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
