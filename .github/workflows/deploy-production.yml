name: Deploy to Production (Orchestrator)

on:
  push:
    paths-ignore: ['**/*.md', 'docs/**', '.claude/**', '.vscode/**', 'LICENSE']
    branches:
      - release
  workflow_dispatch:
    inputs:
      deployment-mode:
        description: 'Deployment mode'
        required: true
        type: choice
        default: 'full'
        options:
          - 'full'
          - 'smart'
          - 'backend-only'
          - 'frontend-only'
          - 'infra-only'
      skip-migrations:
        description: 'Skip database migrations'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Detect what components changed
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      infra: ${{ steps.detect.outputs.infra }}
      deployment-mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine deployment mode
        id: mode
        run: |
          if [[ "${{ github.event.inputs.deployment-mode }}" == *"full"* ]]; then
            echo "mode=full" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.deployment-mode }}" == *"backend"* ]]; then
            echo "mode=backend-only" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.deployment-mode }}" == *"frontend"* ]]; then
            echo "mode=frontend-only" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.deployment-mode }}" == *"infra"* ]]; then
            echo "mode=infra-only" >> $GITHUB_OUTPUT
          else
            echo "mode=smart" >> $GITHUB_OUTPUT
          fi

      - name: Detect component changes (smart mode)
        id: detect
        run: |
          if [[ "${{ steps.mode.outputs.mode }}" == "full" ]]; then
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "infra=true" >> $GITHUB_OUTPUT
          else
            # Detect if backend actually changed
            if git diff origin/release HEAD --name-only | grep -qE '^(CueFinderBE|SolutionLibraries)'; then
              echo "backend=true" >> $GITHUB_OUTPUT
            else
              echo "backend=false" >> $GITHUB_OUTPUT
            fi

            # Detect if frontend changed
            if git diff origin/release HEAD --name-only | grep -qE '^CueFinderFE'; then
              echo "frontend=true" >> $GITHUB_OUTPUT
            else
              echo "frontend=false" >> $GITHUB_OUTPUT
            fi

            # Detect if infra changed
            if git diff origin/release HEAD --name-only | grep -qE '^(init\.sql|scripts|SolutionLibraries/CueFinderModerator|deployment/Dockerfile\.nudenet)'; then
              echo "infra=true" >> $GITHUB_OUTPUT
            else
              echo "infra=false" >> $GITHUB_OUTPUT
            fi
          fi

  # Orchestrate the deployment
  orchestrate:
    name: Orchestrate Deployment
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check deployment plan
        run: |
          MODE="${{ needs.detect-changes.outputs.deployment-mode }}"
          BACKEND="${{ needs.detect-changes.outputs.backend }}"
          FRONTEND="${{ needs.detect-changes.outputs.frontend }}"
          INFRA="${{ needs.detect-changes.outputs.infra }}"

          echo "🎯 Deployment Plan ($MODE mode):"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Backend:      $([ "$BACKEND" = "true" ] && echo "✅ Will deploy" || echo "⏭️  Skip")"
          echo "Frontend:     $([ "$FRONTEND" = "true" ] && echo "✅ Will deploy" || echo "⏭️  Skip")"
          echo "Infrastructure: $([ "$INFRA" = "true" ] && echo "✅ Will deploy" || echo "⏭️  Skip")"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Trigger Backend Deployment
        if: needs.detect-changes.outputs.backend == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log('📦 Triggering backend deployment workflow...');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-backend.yml',
              ref: 'release'
            });

      - name: Trigger Frontend Deployment
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log('📦 Triggering frontend deployment workflow...');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-frontend.yml',
              ref: 'release'
            });

      - name: Trigger Infrastructure Deployment
        if: needs.detect-changes.outputs.infra == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log('📦 Triggering infrastructure deployment workflow...');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-infra.yml',
              ref: 'release',
              inputs: {
                'skip-migrations': '${{ github.event.inputs.skip-migrations || false }}'
              }
            });

      - name: Notify - Deployment Started
        run: |
          echo "🚀 Deployment orchestration started!"
          echo ""
          echo "Triggered workflows:"
          echo "  • Backend:  ${{ needs.detect-changes.outputs.backend == 'true' && '✅' || '⏭️' }}"
          echo "  • Frontend: ${{ needs.detect-changes.outputs.frontend == 'true' && '✅' || '⏭️' }}"
          echo "  • Infra:    ${{ needs.detect-changes.outputs.infra == 'true' && '✅' || '⏭️' }}"
          echo ""
          echo "Check individual workflows for progress and logs."
