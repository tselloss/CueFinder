name: Deploy to Production

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        shell: bash
        run: |
          set -euo pipefail
          : "${HOME:?HOME is not set}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Use printf to avoid newline/escape issues when writing multi-line secrets
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

          # Prevent interactive host key prompts
          ssh-keyscan -H "$SERVER_IP" >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy to Server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: cuefinder
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_API_URL: ${{ secrets.FRONTEND_API_URL }}
          CORS_FRONTEND_ORIGIN: ${{ secrets.CORS_FRONTEND_ORIGIN }}
        run: |
          # Create deployment script
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "🚀 Starting deployment to production..."
          
          # Navigate to app directory
          cd /home/cuefinder/app
          
          # Pull latest code
          if [ -d ".git" ]; then
            echo "📦 Pulling latest changes..."
            git fetch --prune origin
            git checkout release
            git pull --ff-only origin release
          else
            echo "📦 Cloning repository..."
            git clone --branch release git@github.com:${{ github.repository }}.git .
          fi
          
          # Create .env file with all required variables
          echo "⚙️  Configuring environment..."
          echo "DB_PASSWORD=${DB_PASSWORD}" > .env
          echo "JWT_SECRET=${JWT_SECRET}" >> .env
          echo "FRONTEND_API_URL=${FRONTEND_API_URL}" >> .env
          echo "CORS_FRONTEND_ORIGIN=${CORS_FRONTEND_ORIGIN}" >> .env
          
          # Build and deploy with Docker Compose
          echo "🐳 Building and starting containers..."
          if command -v docker-compose >/dev/null 2>&1; then
            DC="docker-compose"
          else
            DC="docker compose"
          fi

          # Stop all containers first (including orphans/detached)
          $DC -f docker-compose.yml -f docker-compose.prod.yml down --remove-orphans
          $DC -f docker-compose.yml -f docker-compose.prod.yml build --no-cache
          $DC -f docker-compose.yml -f docker-compose.prod.yml up -d
          
          # Check container status
          echo "📊 Container status:"
          $DC -f docker-compose.yml -f docker-compose.prod.yml ps
          
          echo "✅ Deployment complete!"
          EOF
          
          # Copy and execute deployment script
          scp deploy.sh $SERVER_USER@$SERVER_IP:/home/cuefinder/deploy.sh
          ssh $SERVER_USER@$SERVER_IP "chmod +x /home/cuefinder/deploy.sh && DB_PASSWORD='$DB_PASSWORD' JWT_SECRET='$JWT_SECRET' FRONTEND_API_URL='$FRONTEND_API_URL' CORS_FRONTEND_ORIGIN='$CORS_FRONTEND_ORIGIN' /home/cuefinder/deploy.sh"

      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployment..."
          ssh cuefinder@${{ secrets.SERVER_IP }} "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
          
      - name: Notify Success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Frontend: http://${{ secrets.SERVER_IP }}"
          echo "🔧 Backend: http://${{ secrets.SERVER_IP }}:5000"
