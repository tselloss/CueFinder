name: Deploy to Production

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup SSH
      - name: Setup SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        shell: bash
        run: |
          set -euo pipefail
          : "${HOME:?HOME is not set}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Write private key
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

          # Prevent interactive host key prompts
          ssh-keyscan -H "$SERVER_IP" >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      # 3️⃣ Deploy to server
      - name: Deploy to Server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: cuefinder
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_API_URL: ${{ secrets.FRONTEND_API_URL }}
          CORS_FRONTEND_ORIGIN: ${{ secrets.CORS_FRONTEND_ORIGIN }}
        shell: bash
        run: |
          # Create deploy script locally
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "🚀 Starting deployment to production..."
          
          cd /home/cuefinder/app
          
          # Pull latest code
          if [ -d ".git" ]; then
            echo "📦 Pulling latest changes..."
            git fetch --prune origin
            git checkout release
            git reset --hard origin/release
          else
            echo "📦 Cloning repository..."
            git clone --branch release git@github.com:${GITHUB_REPOSITORY}.git .
          fi
          
          # Build and deploy containers
          echo "🐳 Building and starting containers..."
          if command -v docker-compose >/dev/null 2>&1; then
            DC="docker-compose"
          else
            DC="docker compose"
          fi
          
          $DC -f docker-compose.yml -f docker-compose.prod.yml down --remove-orphans
          $DC -f docker-compose.yml -f docker-compose.prod.yml build --no-cache
          $DC -f docker-compose.yml -f docker-compose.prod.yml up -d
          
          echo "📊 Container status:"
          $DC -f docker-compose.yml -f docker-compose.prod.yml ps
          
          echo "✅ Deployment complete!"
          EOF

          # Copy deploy script to server
          scp deploy.sh $SERVER_USER@$SERVER_IP:/home/cuefinder/deploy.sh

          # Write .env and run deploy script on server
          ssh $SERVER_USER@$SERVER_IP "
          export DB_PASSWORD='$DB_PASSWORD';
          export JWT_SECRET='$JWT_SECRET';
          export FRONTEND_API_URL='$FRONTEND_API_URL';
          export CORS_FRONTEND_ORIGIN='$CORS_FRONTEND_ORIGIN';

          # Write .env file
          cat > /home/cuefinder/app/.env <<EOF
          DB_PASSWORD=$DB_PASSWORD
          JWT_SECRET=$JWT_SECRET
          FRONTEND_API_URL=$FRONTEND_API_URL
          CORS_FRONTEND_ORIGIN=$CORS_FRONTEND_ORIGIN
          EOF
          
          chmod +x /home/cuefinder/deploy.sh
          /home/cuefinder/deploy.sh
          "

      # 4️⃣ Verify deployment
      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployment..."
          ssh cuefinder@${{ secrets.SERVER_IP }} "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"

      # 5️⃣ Notify success
      - name: Notify Success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Frontend: http://${{ secrets.SERVER_IP }}"
          echo "🔧 Backend: http://${{ secrets.SERVER_IP }}:5000"
