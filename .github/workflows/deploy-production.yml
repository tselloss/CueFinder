name: Deploy to Production

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup SSH
      - name: Setup SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

          ssh-keyscan -H "$SERVER_IP" >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      # 3️⃣ Deploy to server
      - name: Deploy to Server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: cuefinder
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_API_URL: ${{ secrets.FRONTEND_API_URL }}
          CORS_FRONTEND_ORIGIN: ${{ secrets.CORS_FRONTEND_ORIGIN }}
        shell: bash
        run: |
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail

          echo "🚀 Starting deployment to production..."

          cd /home/cuefinder/app || exit

          # Pull latest code or clone if missing
          if [ -d ".git" ]; then
            echo "📦 Pulling latest changes..."
            git fetch --prune origin
            git checkout release
            git reset --hard origin/release
          else
            echo "📦 Cloning repository..."
            git clone --branch release git@github.com:${GITHUB_REPOSITORY}.git .
          fi

          # Write .env file safely
          cat > .env <<ENV
          DB_PASSWORD="$DB_PASSWORD"
          JWT_SECRET="$JWT_SECRET"
          FRONTEND_API_URL="$FRONTEND_API_URL"
          CORS_FRONTEND_ORIGIN="$CORS_FRONTEND_ORIGIN"
          ENV

          # Docker Compose command detection
          if command -v docker-compose >/dev/null 2>&1; then
            DC="docker-compose"
          else
            DC="docker compose"
          fi

          # Stop & remove old containers
          $DC -f docker-compose.yml -f docker-compose.prod.yml down --remove-orphans

          # Build containers with frontend build-arg
          $DC -f docker-compose.yml -f docker-compose.prod.yml build --no-cache \
              --build-arg REACT_APP_API_URL="$FRONTEND_API_URL"

          # Start containers
          $DC -f docker-compose.yml -f docker-compose.prod.yml up -d

          # Show status
          echo "📊 Container status:"
          $DC -f docker-compose.yml -f docker-compose.prod.yml ps

          echo "✅ Deployment complete!"
          EOF

          # Copy deploy script to server
          scp deploy.sh $SERVER_USER@$SERVER_IP:/home/cuefinder/deploy.sh

          # Run deploy script on server
          ssh $SERVER_USER@$SERVER_IP "
          chmod +x /home/cuefinder/deploy.sh
          /home/cuefinder/deploy.sh
          "

      # 4️⃣ Optional: Install/renew SSL certificates with Certbot
      - name: Ensure SSL certificates (Certbot)
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: cuefinder
        shell: bash
        run: |
          ssh $SERVER_USER@$SERVER_IP "
          sudo apt update && sudo apt install -y certbot python3-certbot-nginx
          sudo mkdir -p /var/www/certbot
          sudo certbot certonly --webroot -w /var/www/certbot \
            -d billiardscuefinder.com -d www.billiardscuefinder.com \
            --non-interactive --agree-tos -m admin@billiardscuefinder.com || true
          "

      # 5️⃣ Verify deployment
      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployment..."
          ssh cuefinder@${{ secrets.SERVER_IP }} "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"

      # 6️⃣ Notify success
      - name: Notify Success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Frontend: http://billiardscuefinder.com"
          echo "🔧 Backend: http://billiardscuefinder.com:5000"
