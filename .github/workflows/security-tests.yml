name: Security Tests

on:
  push:
    branches: [main, develop, release]
  pull_request:
    branches: [main, develop, release]
  schedule:
    # Run security tests every Monday at 2 AM
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  security-tests:
    name: Run Security & Penetration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/SecurityTests/package-lock.json

      - name: Install security test dependencies
        working-directory: tests/SecurityTests
        run: npm ci

      - name: Start Docker containers for testing
        run: |
          docker compose up -d
          echo "Waiting for services to be ready..."
          sleep 15

      - name: Wait for application health
        run: |
          echo "Checking application health..."
          for i in {1..30}; do
            if curl -f http://localhost:5000/health > /dev/null 2>&1; then
              echo "✅ Application is ready"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "❌ Application failed to start"
          exit 1

      - name: Run API Security Tests
        working-directory: tests/SecurityTests
        env:
          API_URL: http://localhost:5000
        run: |
          echo "🔍 Running API Security Tests..."
          node api-security-tests.js

      - name: Run Authentication Security Tests
        working-directory: tests/SecurityTests
        env:
          API_URL: http://localhost:5000
        run: |
          echo "🔐 Running Authentication Security Tests..."
          node auth-penetration-tests.js || true

      - name: Run File Upload Security Tests
        working-directory: tests/SecurityTests
        env:
          API_URL: http://localhost:5000
        run: |
          echo "📁 Running File Upload Security Tests..."
          node file-upload-security-tests.js || true

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: tests/SecurityTests/*-report-*.json
          retention-days: 30

      - name: Check for vulnerabilities
        working-directory: tests/SecurityTests
        run: |
          echo "📊 Analyzing security test results..."
          
          # Find the most recent security report
          REPORT=$(ls -t security-report-*.json 2>/dev/null | head -n1)
          
          if [ ! -f "$REPORT" ]; then
            echo "⚠️ No security report found"
            exit 0
          fi
          
          # Check for critical or high vulnerabilities
          CRITICAL=$(jq '.summary.critical' "$REPORT")
          HIGH=$(jq '.summary.high' "$REPORT")
          TOTAL=$(jq '.summary.total' "$REPORT")
          
          echo "Security Test Results:"
          echo "  Total vulnerabilities: $TOTAL"
          echo "  Critical: $CRITICAL"
          echo "  High: $HIGH"
          
          if [ "$CRITICAL" -gt "0" ]; then
            echo "❌ CRITICAL vulnerabilities found! Failing build."
            exit 1
          fi
          
          if [ "$HIGH" -gt "0" ]; then
            echo "⚠️ HIGH severity vulnerabilities found! Review required."
            exit 1
          fi
          
          echo "✅ No critical or high vulnerabilities detected"

      - name: Stop Docker containers
        if: always()
        run: docker compose down

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const reportsDir = 'tests/SecurityTests';
            const files = fs.readdirSync(reportsDir);
            const reportFile = files.filter(f => f.match(/security-report-.*\.json/)).pop();
            
            if (!reportFile) {
              console.log('No security report found');
              return;
            }
            
            const report = JSON.parse(fs.readFileSync(path.join(reportsDir, reportFile)));
            
            const body = `## 🔒 Security Test Results
            
**Target:** ${report.target}
**Timestamp:** ${report.timestamp}

### Summary
- Total Vulnerabilities: **${report.summary.total}**
- Critical: **${report.summary.critical}** 🔴
- High: **${report.summary.high}** 🟠
- Medium: **${report.summary.medium}** 🟡
- Low: **${report.summary.low}** 🟢

${report.summary.total === 0 ? '✅ **No vulnerabilities detected!**' : '⚠️ **Vulnerabilities found - review required**'}

${report.vulnerabilities.length > 0 ? `
### Vulnerabilities Found

${report.vulnerabilities.map((v, i) => `
**${i + 1}. [${v.severity}] ${v.endpoint || v.area}**
- ${v.description}
- Details: \`${JSON.stringify(v.details || v.payload)}\`
`).join('\n')}
` : ''}

<details>
<summary>View Full Report</summary>

\`\`\`json
${JSON.stringify(report, null, 2)}
\`\`\`

</details>
`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
