name: Deploy Infrastructure (DB, Moderation, etc)

# Triggers: Database migrations, Moderation updates, Infrastructure changes, Manual dispatch
on:
  push:
    branches:
      - release
    paths:
      - 'init.sql/**'
      - 'scripts/**'
      - 'SolutionLibraries/CueFinderModerator/**'
      - 'deployment/Dockerfile.nudenet'
      - 'deployment/nudenet_*'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:
    inputs:
      skip-migrations:
        description: 'Skip database migrations'
        required: false
        type: boolean
        default: false

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.detect.outputs.infra }}
      database: ${{ steps.detect.outputs.database }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect component changes
        id: detect
        run: |
          BACKEND_CHANGED=false
          DATABASE_CHANGED=false
          
          if git diff origin/release HEAD --name-only | grep -qE '^(init\.sql|scripts/.*\.sql)'; then
            DATABASE_CHANGED=true
          fi
          
          if git diff origin/release HEAD --name-only | grep -qE '^(SolutionLibraries/CueFinderModerator|deployment/(Dockerfile\.nudenet|nudenet))'; then
            BACKEND_CHANGED=true
          fi
          
          if [ "$DATABASE_CHANGED" = true ] || [ "$BACKEND_CHANGED" = true ]; then
            HAS_CHANGES=true
          else
            HAS_CHANGES=false
          fi
          
          echo "infra=$BACKEND_CHANGED" >> $GITHUB_OUTPUT
          echo "database=$DATABASE_CHANGED" >> $GITHUB_OUTPUT
          echo "has-changes=$HAS_CHANGES" >> $GITHUB_OUTPUT

  test-migrations:
    name: Test Database Migrations
    runs-on: ubuntu-latest
    needs: detect-changes
    # Always run tests on push to release, skip if only manual dispatch with no changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.database == 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cuefinder_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run migrations
        env:
          PGPASSWORD: testpass
        run: |
          # Wait for postgres to be ready
          for i in {1..30}; do
            if psql -h localhost -U postgres -d cuefinder_test -c "SELECT 1" > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          
          # Run all migrations
          for migration in init.sql/*.sql scripts/*.sql; do
            if [ -f "$migration" ]; then
              echo "Running migration: $migration"
              psql -h localhost -U postgres -d cuefinder_test -f "$migration" || echo "⚠️  Migration had warnings"
            fi
          done
          
          echo "✓ All migrations completed successfully"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [detect-changes, test-migrations]
    # Always deploy on push, only deploy on manual if changes detected
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.has-changes == 'true'
    environment:
      name: production
      url: https://billiardscuefinder.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${HOME:?HOME is not set}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

          ssh-keyscan -H "$SERVER_IP" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy infrastructure
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: cuefinder
          SKIP_MIGRATIONS: ${{ github.event.inputs.skip-migrations || 'false' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_API_URL: ${{ secrets.FRONTEND_API_URL }}
          CORS_FRONTEND_ORIGIN: ${{ secrets.CORS_FRONTEND_ORIGIN }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'cuefinderinfo@gmail.com' }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_PROJECT_ID: ${{ secrets.GMAIL_PROJECT_ID }}
        shell: bash
        run: |
          cat > deploy-infra.sh << DEPLOY_SCRIPT
          #!/bin/bash
          set -e
          
          echo "🚀 Starting infrastructure deployment..."
          
          cd /home/cuefinder/app
          
          # Pull latest code
          echo "📦 Pulling latest changes..."
          git fetch --prune origin
          git checkout release
          git reset --hard origin/release
          git clean -fdx -e uploads/ -e .deployment/ -e ssl/
          
          # Create .env file with all secrets (properly quoted for special characters)
          echo "⚙️  Updating environment..."
          cat > .env << 'ENVEOF'
          DB_PASSWORD="\$DB_PASSWORD"
          JWT_SECRET="\$JWT_SECRET"
          FRONTEND_API_URL="\$FRONTEND_API_URL"
          CORS_FRONTEND_ORIGIN="\$CORS_FRONTEND_ORIGIN"
          SMTP_PASSWORD="\$SMTP_PASSWORD"
          SMTP_SERVER="\$SMTP_SERVER"
          SMTP_PORT="\$SMTP_PORT"
          EMAIL_FROM="\$EMAIL_FROM"
          GMAIL_CLIENT_ID="\$GMAIL_CLIENT_ID"
          GMAIL_CLIENT_SECRET="\$GMAIL_CLIENT_SECRET"
          GMAIL_PROJECT_ID="\$GMAIL_PROJECT_ID"
          ENVEOF
                    
                    echo "📋 Environment file created"
                    echo "✓ Environment configured"
          
          # Run database migrations (if needed)
          if [ "\$SKIP_MIGRATIONS" != "true" ]; then
            echo "🗄️  Running database migrations..."
            
            # Create backup before migrations (assumes cuefinder-postgres-prod container exists)
            mkdir -p /home/cuefinder/backups
            BACKUP_FILE="/home/cuefinder/backups/cuefinder_backup_\$(date +%Y%m%d_%H%M%S).sql"
            docker exec cuefinder-postgres-prod pg_dump -U postgres -d cuefinder > "\$BACKUP_FILE"
            echo "   Backup created: \$BACKUP_FILE"
            
            # Run migrations
            if [ -d "init.sql" ]; then
              for migration in init.sql/*.sql; do
                if [ -f "\$migration" ]; then
                  echo "   Running: \$(basename \$migration)"
                  docker exec -i cuefinder-postgres-prod psql -U postgres -d cuefinder < "\$migration" || echo "   ⚠️  Migration had warnings"
                fi
              done
            fi
            
            if [ -d "scripts" ]; then
              for migration in scripts/*.sql; do
                if [ -f "\$migration" ]; then
                  echo "   Running: \$(basename \$migration)"
                  docker exec -i cuefinder-postgres-prod psql -U postgres -d cuefinder < "\$migration" || echo "   ⚠️  Migration had warnings"
                fi
              done
            fi
            
            echo "✓ Database migrations completed"
          else
            echo "⏭️  Skipping migrations (--skip-migrations flag)"
          fi
          
          # Update infrastructure services
          echo "🔄 Updating infrastructure services..."
          docker compose -f docker-compose.yml -f docker-compose.prod.yml build opennsfw
          docker compose -f docker-compose.yml -f docker-compose.prod.yml build moderator
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d opennsfw moderator
          
          # Wait for services to be healthy
          echo "⏳ Waiting for services to become healthy..."
          for i in {1..30}; do
            if docker compose ps | grep -q "opennsfw.*Up" && docker compose ps | grep -q "moderator.*Up"; then
              break
            fi
            sleep 2
          done
          
          echo "✅ Infrastructure deployment completed"
          DEPLOY_SCRIPT

          chmod +x deploy-infra.sh
          
          scp -o StrictHostKeyChecking=no deploy-infra.sh \
            "$SERVER_USER@$SERVER_IP:/home/$SERVER_USER/app/"
          
          ssh -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_IP" \
            'bash /home/cuefinder/app/deploy-infra.sh'

      - name: Verify deployment
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: cuefinder
        shell: bash
        run: |
          echo "🔍 Verifying infrastructure deployment..."
          
          # Check service status
          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" \
            'cd /home/cuefinder/app && docker compose ps'
