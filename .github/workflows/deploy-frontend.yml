name: Deploy Frontend

# Trigger on:
# - Changes to frontend code
# - Manual trigger
on:
  push:
    branches:
      - release
    paths:
      - 'CueFinderFE/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect component changes
        id: detect
        run: |
          # Detect if frontend actually changed
          if git diff origin/release HEAD --name-only | grep -qE '^CueFinderFE'; then
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
            echo "has-changes=false" >> $GITHUB_OUTPUT
          fi

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    # Always run tests on push to release, skip if only manual dispatch with no changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.frontend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'CueFinderFE/cuefinderfe/package-lock.json'

      - name: Install dependencies
        run: |
          cd CueFinderFE/cuefinderfe
          npm ci

      - name: Build
        run: |
          cd CueFinderFE/cuefinderfe
          npm run build

      - name: Run linting
        run: |
          cd CueFinderFE/cuefinderfe
          npm run lint || echo "⚠️  Lint warnings, but continuing"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [detect-changes, test-frontend]
    # Always deploy on push, only deploy on manual if changes detected
    if: github.event_name == 'push' || needs.detect-changes.outputs.has-changes == 'true'
    environment:
      name: production
      url: https://billiardscuefinder.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${HOME:?HOME is not set}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

          ssh-keyscan -H "$SERVER_IP" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy frontend
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: cuefinder
        shell: bash
        run: |
          cat > deploy-frontend.sh << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -e
          
          echo "🚀 Starting frontend deployment..."
          
          cd /home/cuefinder/app
          
          # Pull latest code
          echo "📦 Pulling latest changes..."
          git fetch --prune origin
          git checkout release
          git reset --hard origin/release
          git clean -fdx -e uploads/ -e .deployment/ -e ssl/
          
          # Install Node.js if not present
          if ! command -v node &> /dev/null; then
            echo "📦 Installing Node.js..."
            # Try using nvm (no sudo required)
            curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm install 18
            nvm use 18
          fi
          
          # Build frontend
          echo "🔨 Building frontend..."
          cd CueFinderFE/cuefinderfe
          npm ci --prefer-offline --no-audit
          npm run build
          
          cd /home/cuefinder/app
          
          # Create backup of current build
          if [ -d "/var/www/cuefinder/current" ]; then
            TIMESTAMP=$(date +%s)
            sudo mv /var/www/cuefinder/current "/var/www/cuefinder/backup-$TIMESTAMP"
            echo "  Backed up previous build"
          fi
          
          # Deploy new build (atomic operation)
          echo "📦 Deploying new build..."
          sudo mkdir -p /var/www/cuefinder
          sudo cp -r CueFinderFE/cuefinderfe/build /var/www/cuefinder/current
          sudo chown -R cuefinder:cuefinder /var/www/cuefinder
          
          # Verify deployment
          if [ -f "/var/www/cuefinder/current/index.html" ]; then
            echo "✅ Frontend deployed successfully"
            echo "   No downtime - instant availability"
          else
            echo "❌ Deployment failed - index.html not found"
            exit 1
          fi
          
          # Cleanup old backups (keep only 3 latest)
          echo "🧹 Cleaning up old backups..."
          sudo ls -td /var/www/cuefinder/backup-* 2>/dev/null | tail -n +4 | xargs -r sudo rm -rf
          DEPLOY_SCRIPT

          chmod +x deploy-frontend.sh
          
          scp -o StrictHostKeyChecking=no deploy-frontend.sh \
            "$SERVER_USER@$SERVER_IP:/home/$SERVER_USER/app/"
          
          ssh -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_IP" \
            'bash /home/cuefinder/app/deploy-frontend.sh'

      - name: Verify deployment
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: cuefinder
        shell: bash
        run: |
          echo "🔍 Verifying frontend deployment..."
          
          # Check if index.html exists
          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" \
            'test -f /var/www/cuefinder/current/index.html && echo "✓ Frontend verified"'
