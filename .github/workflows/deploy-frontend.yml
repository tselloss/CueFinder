name: Deploy Frontend

# Trigger on:
# - Changes to frontend code
# - Manual trigger
# Test build: 035e34b
on:
  push:
    branches:
      - release
    paths:
      - 'CueFinderFE/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect component changes
        id: detect
        run: |
          # Detect if frontend actually changed
          if git diff origin/release HEAD --name-only | grep -qE '^CueFinderFE'; then
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
            echo "has-changes=false" >> $GITHUB_OUTPUT
          fi

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    # Always run tests on push to release or manual workflow_dispatch
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.frontend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: 'CueFinderFE/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd CueFinderFE
          pnpm install --frozen-lockfile

      - name: Build
        run: |
          cd CueFinderFE
          pnpm --filter @cuefinder/app run build

      - name: Run linting
        run: |
          cd CueFinderFE
          pnpm --filter @cuefinder/app run lint || echo "⚠️  Lint warnings, but continuing"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [detect-changes, test-frontend]
    # Always deploy on push or manual workflow_dispatch
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.has-changes == 'true'
    environment:
      name: production
      url: https://billiardscuefinder.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${HOME:?HOME is not set}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

          ssh-keyscan -H "$SERVER_IP" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy frontend
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: cuefinder
        shell: bash
        run: |
          cat > deploy-frontend.sh << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -e
          
          echo "🚀 Starting frontend deployment..."
          
          cd /home/cuefinder/app
          
          # Pull latest code
          echo "📦 Pulling latest changes..."
          git fetch --prune origin
          git checkout release
          git reset --hard origin/release
          git clean -fdx -e uploads/ -e .deployment/ -e ssl/
          
          # Install Node.js if not present
          if ! command -v node &> /dev/null; then
            echo "📦 Installing Node.js..."
            # Try using nvm (no sudo required)
            curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm install 18
            nvm use 18
          fi
          
          # Build frontend (pre-check before Docker build)
          echo "🔨 Building frontend..."
          cd CueFinderFE
          npm install -g pnpm@10
          pnpm install --frozen-lockfile
          pnpm --filter @cuefinder/app run build

          cd /home/cuefinder/app
          
          # Deploy via Docker Compose (no /var/www permissions needed)
          echo "📦 Deploying frontend via Docker..."
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --build frontend
          
          # Wait for container to be healthy
          echo "⏳ Waiting for frontend health check..."
          TIMEOUT=30
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            if docker compose ps frontend | grep -q "healthy\|Up.*health"; then
              echo "✅ Frontend deployed and healthy"
              break
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "⚠️  Frontend health check timeout, but deployment completed"
          fi
          DEPLOY_SCRIPT

          chmod +x deploy-frontend.sh
          
          scp -o StrictHostKeyChecking=no deploy-frontend.sh \
            "$SERVER_USER@$SERVER_IP:/home/$SERVER_USER/app/"
          
          ssh -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_IP" \
            'bash /home/cuefinder/app/deploy-frontend.sh'

      - name: Verify deployment
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: cuefinder
        shell: bash
        run: |
          echo "🔍 Verifying frontend deployment..."
          
          # Check if container is healthy
          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" \
            'docker compose -f /home/cuefinder/app/docker-compose.yml -f /home/cuefinder/app/docker-compose.prod.yml ps frontend | grep -q "healthy\|Up" && echo "✓ Frontend container verified and healthy" || echo "⚠️  Frontend container running"'
