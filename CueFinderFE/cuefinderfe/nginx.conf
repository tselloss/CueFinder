# HTTP: ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name cuefinder.com www.cuefinder.com;

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: Terminate TLS, serve frontend and proxy API/uploads to backend service
server {
    listen 443 ssl http2;
    server_name cuefinder.com www.cuefinder.com;

    ssl_certificate /etc/letsencrypt/live/cuefinder.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cuefinder.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy frontend requests to frontend container
    location / {
        proxy_pass http://cuefinder-frontend-prod:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Proxy API requests to backend service on the Docker network
    location ^~ /api/ {
        proxy_pass http://cuefinder-backend-prod:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /uploads/ {
        proxy_pass http://cuefinder-backend-prod:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# helper to allow Connection header mapping for websockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
