server {
    listen 443 ssl http2;
    server_name billiardscuefinder.com www.billiardscuefinder.com;

    ssl_certificate /etc/letsencrypt/live/cuefinder.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cuefinder.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; # recommended by certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to backend service on the Docker network
    location ^~ /api/ {
        proxy_pass http://cuefinder-backend-prod:5000;   # no trailing path -> preserves original URI
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /uploads/ {
        proxy_pass http://cuefinder-backend-prod:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# small helper for websocket connection header mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}