# HTTP: redirect all traffic to HTTPS
server {
    listen 80;
    server_name billiardscuefinder.com www.billiardscuefinder.com;

    # ACME challenge for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: terminate TLS and proxy to Docker services
server {
    listen 443 ssl http2;
    server_name billiardscuefinder.com www.billiardscuefinder.com;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/billiardscuefinder.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/billiardscuefinder.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend proxy
    location / {
        proxy_pass http://cuefinder-frontend-prod:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # API proxy
    location ^~ /api/ {
        proxy_pass http://cuefinder-backend-prod:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Uploads - serve directly from mounted volume
    location ^~ /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# WebSocket helper
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
