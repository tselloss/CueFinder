# Simple nginx config for serving React SPA
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # OAuth callback - serve static HTML that processes tokens before React loads
    # This catches both /oauth-callback and /oauth-callback#fragment and /oauth-callback/anything
    location /oauth-callback {
        try_files /oauth-callback.html =404;
    }

    # Catch Google OAuth responses that land in pathname (e.g. /iss=https://accounts.google.com&...)
    location ~* ^/iss= {
        try_files /oauth-callback.html =404;
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
