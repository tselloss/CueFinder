<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="wood" x1="0" x2="1">
      <stop offset="0%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#8b5e3c" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#g1)" opacity="0.12" />

  <!-- long cue shaft -->
  <g transform="translate(150,300) rotate(-20)">
    <rect x="0" y="0" width="850" height="18" rx="9" fill="url(#wood)" />
    <rect x="800" y="-6" width="60" height="30" rx="6" fill="#333" />
    <circle cx="20" cy="9" r="22" fill="#fff" opacity="0.06" />
  </g>

  <!-- small decorative circles -->
  <circle cx="1000" cy="200" r="80" fill="#fff" opacity="0.06" />
  <circle cx="200" cy="1400" r="120" fill="#fff" opacity="0.04" />

</svg>
