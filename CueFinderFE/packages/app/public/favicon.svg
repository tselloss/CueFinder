<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#000000" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Billiard ball with white stripe -->
  <circle cx="50" cy="50" r="45" fill="#000000" stroke="#ffffff" stroke-width="3"/>
  
  <!-- White stripe across the middle -->
  <ellipse cx="50" cy="50" rx="45" ry="12" fill="#ffffff" opacity="0.9"/>
  
  <!-- Highlight for glossy effect -->
  <ellipse cx="35" cy="35" rx="12" ry="12" fill="#ffffff" opacity="0.4"/>
  
  <!-- Number "8" in white stripe -->
  <text x="50" y="58" font-size="32" font-weight="bold" fill="#000000" text-anchor="middle" font-family="Arial, sans-serif">8</text>
</svg>